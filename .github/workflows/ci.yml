name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Surface dependency advisories on every push. Fails only on CRITICAL so
      # the known dev-only / non-exploitable highs (postcss, sharp, brace-
      # expansion — all build-time or unreachable at runtime) stay visible in
      # the log without blocking, while a new critical prod vuln stops the build.
      - run: npm audit --audit-level=critical

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm test

      - run: npm run build
